dimensions:
  snapshot:
    dtype: int
  generator:
    dtype: str
    coords: [bus]  # every generator sits on a bus
  bus:
    dtype: str
  line:
    dtype: str
    coords: {from: bus, to: bus}  # both endpoints are buses

parameters:
  p_max:
    dims: [generator]
  cost:
    dims: [generator]
  cap:
    dims: [line]
  neg_cap:
    dims: [line]
  load:
    dims: [snapshot, bus]

variables:
  p:
    foreach: [snapshot, generator]
    bounds:
      lower: 0
      upper: p_max
  f:
    foreach: [snapshot, line]
    bounds:
      lower: neg_cap
      upper: cap

# Naming the two halves of the nodal balance. Pure substitution before either
# backend sees the model, so this costs nothing at build and nothing at solve —
# what it buys is a constraint that reads as the sentence it is.
expressions:
  gen_at_bus: group_sum(p, over=generator, by=bus)
  net_inflow: group_sum(f, over=line, by=to) - group_sum(f, over=line, by=from)

constraints:
  balance:
    foreach: [snapshot, bus]
    expression: gen_at_bus + net_inflow == load

objectives:
  total_cost:
    sense: minimize
    expression: p * cost
