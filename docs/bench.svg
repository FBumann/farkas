<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 430" font-family="ui-monospace, 'SF Mono', Menlo, monospace">
  <!-- gridlines -->
  <g stroke="#dde3e6" stroke-width="1">
    <line x1="52" y1="378" x2="692" y2="378"/>
    <line x1="52" y1="290" x2="692" y2="290"/>
    <line x1="52" y1="202" x2="692" y2="202"/>
    <line x1="52" y1="114" x2="692" y2="114"/>
    <line x1="52" y1="26"  x2="692" y2="26"/>
  </g>
  <!-- y ticks -->
  <g fill="#75838c" font-size="12" text-anchor="end">
    <text x="42" y="382">0</text>
    <text x="42" y="294">2</text>
    <text x="42" y="206">4</text>
    <text x="42" y="118">6</text>
    <text x="42" y="18">GB</text>
  </g>
  <!-- x axis -->
  <line x1="52" y1="378" x2="692" y2="378" stroke="#cbd3d7" stroke-width="1"/>
  <g fill="#75838c" font-size="12" text-anchor="middle">
    <text x="135" y="402">8.9M</text>
    <text x="372" y="402">35.6M</text>
    <text x="609" y="402">107M</text>
    <text x="372" y="424" fill="#9aa6ad" font-size="11">variables (dispatch model, 89 generators active)</text>
  </g>

  <!-- eager: amber, solid then dashed off the top -->
  <path d="M135.2 278.6 L372 87.6" fill="none" stroke="#d9791f" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M372 87.6 L394.3 32"   fill="none" stroke="#d9791f" stroke-width="2.6" stroke-dasharray="2 5" stroke-linecap="round"/>
  <path d="M394.3 32 l-5 9 l10 0 z" fill="#d9791f"/>
  <circle cx="135.2" cy="278.6" r="5.5" fill="#ffffff" stroke="#d9791f" stroke-width="2.6"/>
  <circle cx="372"   cy="87.6"  r="5.5" fill="#ffffff" stroke="#d9791f" stroke-width="2.6"/>
  <text x="366" y="76" fill="#a85c14" font-size="13" font-weight="700" text-anchor="end">6.60 GB</text>
  <text x="404" y="38"  fill="#a85c14" font-size="13" font-weight="700">≈20 GB</text>
  <text x="404" y="54"  fill="#9aa6ad" font-size="11">exceeds RAM</text>

  <!-- relational: teal, flat -->
  <path d="M135.2 342.4 L372 356.4 L608.8 352.9" fill="none" stroke="#0d9488" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="135.2" cy="342.4" r="5.5" fill="#ffffff" stroke="#0d9488" stroke-width="2.8"/>
  <circle cx="372"   cy="356.4" r="5.5" fill="#ffffff" stroke="#0d9488" stroke-width="2.8"/>
  <circle cx="608.8" cy="352.9" r="5.5" fill="#ffffff" stroke="#0d9488" stroke-width="2.8"/>
  <text x="622" y="357" fill="#0b7d72" font-size="13" font-weight="700">0.57 GB</text>
  <text x="622" y="373" fill="#9aa6ad" font-size="11">@ 512 MB</text>

  <!-- legend -->
  <g font-size="13">
    <rect x="120" y="8" width="20" height="3" rx="1.5" fill="#d9791f"/>
    <text x="148" y="14" fill="#46545d">eager · linopy</text>
    <rect x="270" y="8" width="20" height="3" rx="1.5" fill="#0d9488"/>
    <text x="298" y="14" fill="#46545d">relational · duckdb</text>
  </g>
</svg>
