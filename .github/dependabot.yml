# Deliberately quiet: quarterly, everything grouped into one PR per ecosystem.
# Security updates are unaffected by this cadence (GitHub raises those as
# they land). For full silence on version updates, set
# open-pull-requests-limit: 0 on an ecosystem.
version: 2

updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "quarterly"
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
    groups:
      python:
        patterns:
          - "*"

  # The hook revs in .pre-commit-config.yaml. Its own ecosystem, so its own PR:
  # dependabot groups *within* an ecosystem, never across. That matters for
  # ruff, which is pinned twice — `ruff==` in the dev group and the
  # `ruff-pre-commit` rev here — and the two must move together. Merging one
  # PR without the other runs a different ruff in the hook than in CI, which is
  # how a locally clean commit fails the gate.
  #
  # `tests/test_tooling_pins.py` fails when they disagree, so a half-landed
  # bump is caught by CI on the merge rather than by whoever commits next.
  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "quarterly"
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
    groups:
      hooks:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "quarterly"
    labels:
      - "dependencies"
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns:
          - "*"
