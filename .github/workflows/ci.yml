name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    # bare install: the streaming product with no linopy/xarray on disk.
    # Proves the runtime dependency claim and runs the native suite.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --no-default-groups --no-editable
      - run: uv pip install pytest
      - name: assert linopy is absent
        run: uv run --no-sync python -c "import importlib.util, sys; sys.exit(importlib.util.find_spec('linopy') is not None)"
      - run: uv run --no-sync pytest -q

  full:
    # dev group (incl. linopy/xarray for the oracle): lint, format, types, differential tests.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --group dev
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      # Only here, not in `native`: missing-import is an error, and the compat
      # lane imports linopy/xarray, which the bare install deliberately lacks.
      - run: uv run --no-sync pyrefly check --output-format=github
      - run: uv run --no-sync pytest -q

  ok:
    # The single check the branch ruleset requires. Naming the matrix legs directly
    # would pin the ruleset to the Python versions — adding 3.14 would silently
    # leave it unrequired, and dropping 3.11 would block every PR on a check that
    # can no longer report. This job tracks the matrix instead.
    name: CI ok
    needs: [native, full]
    if: always()  # must report a conclusion even when a dependency fails, or the ruleset waits forever
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if anything upstream did not succeed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: |
          echo "::error::native=${{ needs.native.result }} full=${{ needs.full.result }}"
          exit 1
      - run: echo "native and full both green"
