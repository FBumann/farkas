name: CI

# Billing is per job, rounded up to the minute, and every job here finishes in
# well under one. So the cost of CI is the number of jobs, not their duration —
# the suite itself is ~5s. Keep the job count low; do not split a job to make
# the wall clock look better, it only makes the bill worse.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # The everyday signal: lint, format, types and the suite on one Python.
    # Required by the branch ruleset.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --group dev
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      # Only here, not in the bare leg of `compat`: missing-import is an error,
      # and the linopy lane imports linopy/xarray, which a bare install lacks.
      - run: uv run --no-sync pyrefly check --output-format=github
      - run: uv run --no-sync pytest -q

  compat:
    # The three install shapes that `test` cannot see, on one runner. Each leg
    # re-syncs the venv in place; they are sequential because three jobs would
    # cost three billed minutes to do ~90s of work.
    #
    # Sharing one checkout is safe: `uv.lock` is gitignored, so it is a byproduct
    # of each sync rather than a committed pin, and uv records the resolution
    # strategy in it — the floors leg re-resolves instead of inheriting the
    # versions the leg above it locked. Verified: it installs pandas 2.2.0 /
    # numpy 1.26.0 / pyarrow 16.0.0 either way. Do not add a `--frozen` here.
    #
    # Skipped on push: a squash merge lands the tree the PR already proved, and
    # nothing about the install shapes changes between the two. `test` still
    # runs on main as the net for semantic conflicts between concurrent merges.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      # Deliberately no `python-version:` on setup-uv — it exports UV_PYTHON,
      # which makes the bare leg's `uv pip install` hunt for a venv on that
      # version instead of the 3.12 one `uv sync --python 3.12` just built.
      # Each leg names its own interpreter instead.
      - run: uv python install 3.11 3.12

      - name: "bare install: no linopy/xarray on disk"
        # Proves the runtime dependency claim and runs the native suite.
        run: |
          uv sync --no-default-groups --no-editable --python 3.12
          uv pip install pytest
          uv run --no-sync python -c "import importlib.util, sys; sys.exit(importlib.util.find_spec('linopy') is not None)"
          uv run --no-sync pytest -q

      - name: lowest supported Python, current dependencies
        run: |
          uv sync --group dev --python 3.11
          uv run --no-sync pytest -q

      - name: the declared dependency floors, actually installed
        # Without this the lower bounds are decoration: `>=1.0` on duckdb was
        # five minor versions below the first release with `to_arrow_reader`,
        # and nothing noticed.
        run: |
          uv sync --group dev --python 3.11 --resolution lowest-direct
          uv run --no-sync pytest -q
