name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  native:
    # bare install: the streaming product with no linopy/xarray on disk.
    # Proves the runtime dependency claim and runs the native suite
    # (api, engine, language boundary, architecture enforcement).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --no-dev --no-default-groups
      - run: uv pip install pytest
      - name: assert linopy is absent
        run: uv run --no-sync python -c "import importlib.util, sys; sys.exit(importlib.util.find_spec('linopy') is not None)"
      - run: uv run --no-sync pytest -q

  full:
    # oracle install: differential tests run against linopy.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --extra dev --extra oracle
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      - run: uv run --no-sync pytest -q
