name: PR title

# The squash subject becomes a commit on main, and release-please parses it to
# decide the changelog section (and, once we leave the alpha stream, the version).
# A subject it cannot parse is silently dropped from the changelog — nothing fails,
# the entry just never appears. This check is the only thing standing between a
# sloppy title and a hole in CHANGELOG.md. See RELEASING.md.
#
# Merges are squash-only (repo ruleset), and `squash_merge_commit_title` is
# COMMIT_OR_PR_TITLE: GitHub uses the PR title when a PR has several commits, and
# the single commit's own title when it has exactly one. So both are validated —
# whichever GitHub picks, it has been checked. (Setting the repo to PR_TITLE makes
# it unconditionally the PR title; this check stays correct either way.)

on:
  pull_request:
    # Deliberately no `synchronize`: a title does not change when commits do, and
    # re-running on every push made this a third of the CI bill. The one case it
    # gives up is a force-push that leaves a PR at exactly one commit with a
    # non-conventional subject — that costs a CHANGELOG line, and editing the
    # title (which does re-trigger) fixes it.
    types: [opened, edited, reopened]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  conventional:
    name: Conventional commit subject
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Validate the subject that will land on main
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          COMMIT_COUNT: ${{ github.event.pull_request.commits }}
        run: |
          set -euo pipefail

          # keep in sync with changelog-sections in .release-please-config.json
          TYPES='feat|fix|perf|refactor|docs|chore|test|ci|build|style|revert'
          # type, optional (scope), optional ! for breaking, ": ", then a subject
          PATTERN="^(${TYPES})(\([a-z0-9._/-]+\))?!?: .+"

          fail=0

          check() {
            local what="$1" subject="$2"
            if [[ ! "$subject" =~ $PATTERN ]]; then
              echo "::error::${what} is not a conventional commit subject: ${subject}"
              fail=1
              return
            fi
            if (( ${#subject} > 72 )); then
              echo "::warning::${what} is ${#subject} chars; git and the GitHub UI truncate around 72."
            fi
            echo "ok: ${what} — ${subject}"
          }

          check "PR title" "$PR_TITLE"

          # A breaking marker moves the *base* version, not the alpha counter.
          # The 0.0.0-alpha.N stream was immune — under `versioning: prerelease`
          # a zero patch is an absorbing state, so every bump only incremented
          # the counter. The stream left 0.0.0 at #251 and that immunity went
          # with it: `feat!:` on 0.0.1-alpha.12 produced 0.1.0-alpha.12, which
          # is how the project jumped a minor by accident. Until the release
          # config says otherwise, a breaking marker is refused here rather
          # than discovered in a release PR.
          base=$(sed -n 's/.*"\.": *"\([^"]*\)".*/\1/p' .release-please-manifest.json)
          if [[ "$base" == 0.* ]]; then
            if [[ "$PR_TITLE" =~ ^[a-z]+(\([a-z0-9._/-]+\))?!: ]]; then
              echo "::error::'!' in the title bumps the base version off the pinned alpha stream (currently ${base})."
              fail=1
            fi
            if grep -qE '^BREAKING[ -]CHANGE:' <<<"${PR_BODY:-}"; then
              echo "::error::a 'BREAKING CHANGE:' footer bumps the base version off the pinned alpha stream (currently ${base})."
              fail=1
            fi
          fi

          # exactly one commit: GitHub squashes using that commit's title, not the PR title
          if [[ "$COMMIT_COUNT" == "1" ]]; then
            only=$(gh api "repos/${REPO}/pulls/${NUMBER}/commits" --jq '.[0].commit.message' | head -1)
            check "the single commit's title" "$only"
          fi

          if (( fail )); then
            cat <<EOF

          Expected: <type>[(scope)][!]: <subject>

            types    ${TYPES//|/, }
            examples feat: streaming executor for indexed constraints
                     fix(parser): where clauses with a trailing comma
                     refactor!: closed helper set, no monkey-patch

          A '!' (or a 'BREAKING CHANGE:' footer) is refused while the version is
          pinned to an alpha stream: it moves the *base* version, not the counter.
          Describe the break in the PR body instead — the alpha stream carries no
          compatibility promise, so there is nothing for the version to announce.

          Fix the PR title — no need to rewrite the branch. Edits re-run this check.
          EOF
            exit 1
          fi
