[build-system]
requires = ["hatchling>=1.27", "hatch-vcs"]  # 1.27 is the first with PEP 639 license fields
build-backend = "hatchling.build"

[project]
name = "farkas"
# the git tag is the version — see RELEASING.md. Never hardcode it here.
dynamic = ["version"]
description = "Declarative optimisation: YAML math on a streaming relational engine"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Development Status :: 3 - Alpha",
]
requires-python = ">=3.11"
dependencies = [
    "pandas",
    "numpy",
    "pyparsing>=3.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "duckdb>=1.0",
    # required by the solver_direct sink: duckdb's .to_arrow_reader() streams
    # COO batches to highspy. Used through duckdb, never imported by name.
    "pyarrow",
    "highspy",
]

[project.optional-dependencies]
# linopy + xarray power the compatibility layer (farkas.linopy): YAML math
# on a Python-built linopy.Model, plus the differential-test oracle.
# The streaming engine never imports them.
linopy = [
    "linopy>=0.9.0,<0.10",
    "xarray>=2024.2.0",
]

[project.urls]
repository = "https://github.com/FBumann/farkas"

[tool.hatch.version]
source = "vcs"
# only hit when building outside a git checkout (e.g. an sdist of an sdist)
fallback-version = "0.0.0"

[tool.hatch.build.targets.wheel]
packages = ["src/farkas"]

[tool.hatch.build.targets.sdist]
include = ["/src"]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.15.7",
    "pyrefly==1.1.1",
    "pre-commit==4.6.0",
    "linopy>=0.9.0,<0.10",
    "xarray>=2024.2.0",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "F",     # Pyflakes
    "W",     # pycodestyle warnings
    "I",     # isort
    "B",     # flake8-bugbear
    "N",     # pep8-naming
    "UP",    # pyupgrade
    "FA",    # flake8-future-annotations
    "TC",    # flake8-type-checking
    "SIM",   # flake8-simplify
    "RUF",   # Ruff-specific rules
    "PERF",  # perflint
    "C4",    # flake8-comprehensions
    "PIE",   # flake8-pie
    "RET",   # flake8-return
    "FLY",   # flynt (f-string)
    "FURB",  # refurb
    "T20",   # flake8-print
    "PLC",   # pylint conventions
    "PLE",   # pylint errors
]
ignore = [
    "E501",     # line too long (handled by formatter)
    "RET504",   # unnecessary assignment before return
    "PLC0415",  # import not at top level (lazy imports are load-bearing here)
]
extend-fixable = ["B", "SIM", "RUF", "C4", "UP"]

[tool.ruff.lint.per-file-ignores]
"examples/**/*.py" = ["T20"]  # the walkthrough's whole output is its point
"src/farkas/where_parser.py" = ["N806"]  # grammar tokens (NOT/AND/OR) are named after keywords

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
docstring-code-format = true

[tool.ruff.lint.pyupgrade]
keep-runtime-typing = false

[tool.ruff.lint.flake8-type-checking]
# pydantic models evaluate annotations at runtime to build validators, so imports
# used only in annotations must stay at runtime (not moved to TYPE_CHECKING).
runtime-evaluated-base-classes = ["pydantic.BaseModel"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyrefly]
# check against the *lowest* supported interpreter, so 3.12+ syntax and stdlib
# additions are caught here rather than by the 3.11 leg of the CI matrix.
python-version = "3.11"
project-includes = ["src/farkas"]
preset = "strict"

# Warn-by-default rules promoted to error, so a regression fails CI instead of
# scrolling past. All of these are already clean; each one is a gate, not a TODO.
#
# Where a rule is genuinely wrong about one line, suppress that line with
# `# pyrefly: ignore[rule-name]` and a reason — do not turn the rule off here.
#
# Deliberately NOT promoted:
#   explicit-any — `Any` is the honest type at the xarray/linopy boundary and
#                  in the ParseResults handoff.
#   deprecated   — currently only fires on typeshed's `contextlib.contextmanager`
#                  overload.
[tool.pyrefly.errors]
implicit-import = true
missing-import = true
non-exhaustive-match = true
not-required-key-access = true
redundant-cast = true
redundant-condition = true
unknown-name = true
unnecessary-comparison = true
unnecessary-type-conversion = true
unreachable = true
unresolvable-dunder-all = true
untyped-import = true
unused-ignore = true
variance-mismatch = true
