[build-system]
requires = ["setuptools>=60", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "linopy-yaml"
version = "0.0.2"
description = "YAML-based math definition layer for linopy"
readme = "README.md"
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
]
requires-python = ">=3.11"
dependencies = [
    "pandas",
    "numpy",
    "pyparsing>=3.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "duckdb>=1.0",
    "pyarrow",
    "highspy",
]

[project.optional-dependencies]
# linopy + xarray power the opt-in compatibility layer (linopy_yaml.compat)
# and the differential-test oracle; the streaming engine never imports them
oracle = [
    "linopy>=0.9.0,<0.10",
    "xarray>=2024.2.0",
]
dev = [
    "pytest",
    "pytest-cov",
    "ruff>=0.15,<0.16",  # format-check in CI: pin to the series the repo is formatted with
    "mypy",
    "linopy>=0.9.0,<0.10",
    "xarray>=2024.2.0",
]

[dependency-groups]
# benchmarking tools for scratch/relational_spike — not needed to use or test
spike = [
    "memray",
    "pytest-benchmem",
    "polars",
]

[tool.setuptools.packages.find]
include = ["linopy_yaml*"]

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
ignore_missing_imports = true
