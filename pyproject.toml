[build-system]
requires = ["hatchling>=1.27", "hatch-vcs"]  # 1.27 is the first with PEP 639 license fields
build-backend = "hatchling.build"

[project]
name = "farkas"
# the git tag is the version — see RELEASING.md. Never hardcode it here.
dynamic = ["version"]
description = "Self-documenting optimisation models at any scale: declarative LP/MILP on a streaming relational engine"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
# YAML lives here rather than in the description: it is the format we ship, not
# the contract (that is MathSchema), but it is still how people search.
keywords = [
    "optimisation", "optimization", "linear-programming", "mixed-integer",
    "declarative", "yaml", "polars", "highs", "operations-research",
]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Development Status :: 3 - Alpha",
    "Typing :: Typed",
]
requires-python = ">=3.11"
dependencies = [
    # the relational engine: every frame a model is built from, and the parquet
    # reader that fills them. Arrow-backed, so a result frame exports the
    # PyCapsule protocol and any consumer takes it without this package
    # depending on their library.
    "polars>=1.30",
    # the solver_direct sink's own arithmetic: `searchsorted` builds the CSR
    # row starts HiGHS wants, and the batch coercions are its dtypes. Array
    # work at the solver boundary, not a dataframe dependency.
    "numpy>=1.26",
    "pyparsing>=3.1",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "highspy>=1.10",
]

[project.optional-dependencies]
# linopy + xarray power the compatibility layer (farkas.linopy): YAML math
# on a Python-built linopy.Model, plus the differential-test oracle.
# The streaming engine never imports them.
linopy = [
    "linopy>=0.9.0,<0.10",
    "xarray>=2024.2.0",
    # also what `Result.to_pandas` / `to_dataarray` need. Declared here rather
    # than as a runtime dependency: pandas is a bridge out of the engine, not
    # a part of it, and the bare-install CI job proves the engine builds,
    # solves and reads results back without it.
    "pandas>=2.2",
]

[project.urls]
repository = "https://github.com/FBumann/farkas"

[tool.hatch.version]
source = "vcs"
# only hit when building outside a git checkout (e.g. an sdist of an sdist)
fallback-version = "0.0.0"

[tool.hatch.build.targets.wheel]
packages = ["src/farkas"]

[tool.hatch.build.targets.sdist]
include = ["/src"]

[dependency-groups]
# Regression benchmarks (bench/regressions/). Their own group, not `dev`: memray
# and pytest-benchmark are heavy, and nothing in the test suite or the published
# ladder needs them. `uv sync --group bench` to run them.
bench = [
    "pytest-benchmem>=0.4",
]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.15.7",
    "pyrefly==1.1.1",
    "pre-commit==4.6.0",
    "linopy>=0.9.0,<0.10",
    "xarray>=2024.2.0",
    "pandas>=2.2",
    # how pandas reads parquet, which the benchmark harness's linopy arm does
    # as part of the cost it is there to measure
    "pyarrow>=16",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "F",     # Pyflakes
    "W",     # pycodestyle warnings
    "I",     # isort
    "B",     # flake8-bugbear
    "N",     # pep8-naming
    "UP",    # pyupgrade
    "FA",    # flake8-future-annotations
    "TC",    # flake8-type-checking
    "SIM",   # flake8-simplify
    "RUF",   # Ruff-specific rules
    "PERF",  # perflint
    "C4",    # flake8-comprehensions
    "PIE",   # flake8-pie
    "RET",   # flake8-return
    "FLY",   # flynt (f-string)
    "FURB",  # refurb
    "T20",   # flake8-print
    "PLC",   # pylint conventions
    "PLE",   # pylint errors
]
ignore = [
    "E501",     # line too long (handled by formatter)
    "RET504",   # unnecessary assignment before return
    "PLC0415",  # import not at top level (lazy imports are load-bearing here)
]
extend-fixable = ["B", "SIM", "RUF", "C4", "UP"]

[tool.ruff.lint.per-file-ignores]
"examples/**/*.py" = ["T20"]  # the walkthrough's whole output is its point
"bench/**/*.py" = ["T20"]  # a harness reports by printing; stdout is its interface
"src/farkas/where_parser.py" = ["N806"]  # grammar tokens (NOT/AND/OR) are named after keywords

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
docstring-code-format = true

[tool.ruff.lint.pyupgrade]
keep-runtime-typing = false

[tool.ruff.lint.flake8-type-checking]
# pydantic models evaluate annotations at runtime to build validators, so imports
# used only in annotations must stay at runtime (not moved to TYPE_CHECKING).
runtime-evaluated-base-classes = ["pydantic.BaseModel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config", "-ra"]
# bench/regressions/ is not on testpaths and is run explicitly; the marker is
# declared here because --strict-markers rejects unknown ones when it is.
markers = ["benchmem: regression benchmark (bench/regressions/, needs --group bench)"]
xfail_strict = true
filterwarnings = ["error"]

[tool.pyrefly]
# check against the *lowest* supported interpreter, so 3.12+ syntax and stdlib
# additions are caught here rather than by the 3.11 leg of the CI matrix.
python-version = "3.11"
project-includes = ["src/farkas"]
preset = "strict"

# Warn-by-default rules promoted to error, so a regression fails CI instead of
# scrolling past. All of these are already clean; each one is a gate, not a TODO.
#
# Where a rule is genuinely wrong about one line, suppress that line with
# `# pyrefly: ignore[rule-name]` and a reason — do not turn the rule off here.
#
# Deliberately NOT promoted:
#   explicit-any — `Any` is the honest type at the xarray/linopy boundary and
#                  in the ParseResults handoff.
#   deprecated   — currently only fires on typeshed's `contextlib.contextmanager`
#                  overload.
[tool.pyrefly.errors]
implicit-import = true
missing-import = true
non-exhaustive-match = true
not-required-key-access = true
redundant-cast = true
redundant-condition = true
unknown-name = true
unnecessary-comparison = true
unnecessary-type-conversion = true
unreachable = true
unresolvable-dunder-all = true
untyped-import = true
unused-ignore = true
variance-mismatch = true
