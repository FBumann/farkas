[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "linopy-yaml"
# the git tag is the version — see RELEASING.md. Never hardcode it here.
dynamic = ["version"]
description = "Declarative optimisation: YAML math on a streaming relational engine"
readme = "README.md"
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
]
requires-python = ">=3.11"
dependencies = [
    "pandas",
    "numpy",
    "pyparsing>=3.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "duckdb>=1.0",
    "pyarrow",
    "highspy",
]

[project.optional-dependencies]
# linopy + xarray power the compatibility layer (linopy_yaml.compat): YAML math
# on a Python-built linopy.Model, plus the differential-test oracle.
# The streaming engine never imports them.
compat = [
    "linopy>=0.9.0,<0.10",
    "xarray>=2024.2.0",
]

[project.urls]
repository = "https://github.com/FBumann/linopy-yaml"

[tool.hatch.version]
source = "vcs"
# only hit when building outside a git checkout (e.g. an sdist of an sdist)
fallback-version = "0.0.0"

[tool.hatch.build.targets.wheel]
packages = ["linopy_yaml"]

[tool.hatch.build.targets.sdist]
include = ["linopy_yaml/", "tests/", "LICENSE", "README.md", "ARCHITECTURE.md", "SPEC.md"]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.15.7",
    "mypy==1.19.0",
    "pre-commit==4.6.0",
    "linopy>=0.9.0,<0.10",
    "xarray>=2024.2.0",
]
# benchmarking tools for scratch/relational_spike — not needed to use or test
spike = [
    "memray",
    "pytest-benchmem",
    "polars",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "F",     # Pyflakes
    "W",     # pycodestyle warnings
    "I",     # isort
    "B",     # flake8-bugbear
    "N",     # pep8-naming
    "UP",    # pyupgrade
    "FA",    # flake8-future-annotations
    "TC",    # flake8-type-checking
    "SIM",   # flake8-simplify
    "RUF",   # Ruff-specific rules
    "PERF",  # perflint
    "C4",    # flake8-comprehensions
    "PIE",   # flake8-pie
    "RET",   # flake8-return
    "FLY",   # flynt (f-string)
    "FURB",  # refurb
    "T20",   # flake8-print
    "PLC",   # pylint conventions
    "PLE",   # pylint errors
]
ignore = [
    "E501",     # line too long (handled by formatter)
    "RET504",   # unnecessary assignment before return
    "PLC0415",  # import not at top level (lazy imports are load-bearing here)
]
extend-fixable = ["B", "SIM", "RUF", "C4", "UP"]

[tool.ruff.lint.per-file-ignores]
"scratch/**/*.py" = ["T20"]  # benchmark scripts report via print
"linopy_yaml/where_parser.py" = ["N806"]  # grammar tokens (NOT/AND/OR) are named after keywords

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
docstring-code-format = true

[tool.ruff.lint.pyupgrade]
keep-runtime-typing = false

[tool.ruff.lint.flake8-type-checking]
# pydantic models evaluate annotations at runtime to build validators, so imports
# used only in annotations must stay at runtime (not moved to TYPE_CHECKING).
runtime-evaluated-base-classes = ["pydantic.BaseModel"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
ignore_missing_imports = true
